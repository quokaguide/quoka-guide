<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Quoka Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="icon" href="assets/favicon.ico" />
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html#top" aria-label="Quoka Guide home">
        <img src="assets/quoka-icon.png" alt="Quoka Guide" class="brand-mark" />
        <span class="brand-name">Quoka Guide</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#top">Home</a>
        <a href="plans.html">Plans</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
      <div class="auth">
        <a href="#" class="link">Log In</a>
        <a href="#" class="button small">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Contact split layout -->
  <section class="contact-wrap split-layout">
    <div class="container contact-split">
      
      <!-- Left: Form -->
      <div class="contact-form-side">
        <h2 class="contact-headline">Your business needs to grow, we can help.</h2>

        <form class="contact-card"
              action="mailto:hello@quokaguide.com"
              method="post"
              enctype="text/plain">
          <div class="form-grid">
            <div class="form-field">
              <label for="name">Name <span aria-hidden="true">*</span></label>
              <input id="name" name="name" type="text" placeholder="Your full name" required />
            </div>

            <div class="form-field">
              <label for="email">Email Address <span aria-hidden="true">*</span></label>
              <input id="email" name="email" type="email" placeholder="you@business.com" required />
            </div>

            <div class="form-field">
              <label for="phone">Phone No. <span aria-hidden="true">*</span></label>
              <input id="phone" name="phone" type="tel" placeholder="(555) 555-0123" required />
            </div>

            <div class="form-field span-2">
              <label for="details">Project Details</label>
              <textarea id="details" name="details" rows="5" placeholder="Tell us a little about your project, pages needed, deadlines, and goals."></textarea>
            </div>
          </div>

          <button type="submit" class="button primary block lg">Submit</button>

          <p class="fineprint">
            By submitting, you agree we may contact you about your request. We respect your privacy.
          </p>
        </form>
      </div>

      <!-- Right: Image (swap the src to your preferred image) -->
      <div class="contact-image-side">
        <img src="assets/quokaphone.png" alt="Friendly quokka ready to help" />
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="container footer-inner">
      <small>© <span id="year"></span> Quoka Guide.</small>
      <nav class="footer-nav">
        <a href="mailto:hello@quokaguide.com">hello@quokaguide.com</a>
        <a href="plans.html">Plans</a>
        <a href="index.html#portfolio">Portfolio</a>
      </nav>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
